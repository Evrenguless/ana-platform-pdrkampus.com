name: Public content navigation
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  navigation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/build_content_directory.py --check
      - run: python scripts/test_content_directory.py
