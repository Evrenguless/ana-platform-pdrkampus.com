name: SEO trafik kurtarma
on:
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Düzeltmeleri uygula
        run: |
          cat > "$RUNNER_TEMP/fix.py" <<'PYEOF'
          import json,re,glob,pathlib,subprocess,sys
          R=pathlib.Path('.')
          m=json.load(open('data/kutuphane-route-map.json'))
          # 1) noindex'i yönlendirme sayfalarından kaldır
          n=0
          for old in m:
              p=R/(old.lstrip('/')+'index.html')
              if not p.exists(): continue
              s=p.read_text(encoding='utf-8')
              if 'http-equiv="refresh"' in s and '<meta name="robots" content="noindex,follow">' in s:
                  p.write_text(s.replace('<meta name="robots" content="noindex,follow">','',1),encoding='utf-8'); n+=1
          print('noindex kaldirildi:',n)
          # 2) üretici script
          p=R/'scripts/build_library_catalog.py'; s=p.read_text()
          s=s.replace("""                '<meta name="robots" content="noindex,follow">'\n                '<link rel="canonical\"""","""                # noindex yok: Google meta-refresh(0) + canonical'ı kalıcı yönlendirme sayar.\n                '<link rel="canonical\"""",1)
          old="""from repair_resource_links import repair
          for key in list(outputs):
              if key.endswith('.html'): outputs[key]=repair(ROOT,outputs[key])
          """
          add="""# İç bağlantıları taşınmış eski adresler yerine doğrudan yeni adreslere yönelt.
          if route_map_file.exists():
              _route_map = json.loads(route_map_file.read_text(encoding="utf-8"))
              _old_link = re.compile(r'(https://pdrkampus\\.com)?(/kaynak(?:-detay)?/[A-Za-z0-9_./%-]+?/)(?=["\\'#?])')
              for key in list(outputs):
                  if key.endswith('.html') and '<meta http-equiv="refresh"' not in outputs[key]:
                      outputs[key] = _old_link.sub(lambda mo: (mo.group(1) or '') + _route_map[mo.group(2)] if mo.group(2) in _route_map else mo.group(0), outputs[key])
          """
          assert old in s and '_route_map' not in s; s=s.replace(old,old+add,1); p.write_text(s)
          # 3) denetim scripti yönlendirmeleri tanısın
          p=R/'scripts/seo_engine.py'; s=p.read_text()
          s=s.replace("        self.noindex = False\n","        self.noindex = False\n        self.redirect = False\n",1)
          s=s.replace("            if a.get('name', '').lower() in ('robots','googlebot'):","            if a.get('http-equiv', '').lower() == 'refresh': self.redirect = True\n            if a.get('name', '').lower() in ('robots','googlebot'):",1)
          a=s.index("        issues = []\n        if not page.noindex and page.canonicals"); b=s.index("        rows.append({'url':url")
          blk=s[a:b].replace("        issues = []\n","        issues = []\n        quiet = page.noindex or page.redirect\n",1).replace("if not page.noindex and","if not quiet and")
          blk=blk.replace("        if page.noindex and url in sitemap: issues.append('noindex_in_sitemap')\n","        if page.noindex and url in sitemap: issues.append('noindex_in_sitemap')\n        if page.redirect and url in sitemap: issues.append('redirect_in_sitemap')\n")
          s=s[:a]+blk+s[b:]; s=s.replace("'noindex':page.noindex, 'sitemap'","'noindex':page.noindex, 'redirect':page.redirect, 'sitemap'",1); p.write_text(s)
          # 4) katalogu yeniden üret
          subprocess.run([sys.executable,'scripts/build_library_catalog.py'],check=True)
          # 5) diğer sayfalardaki iç bağlantılar
          pat=re.compile(r'(https://pdrkampus\.com)?(/kaynak(?:-detay)?/[A-Za-z0-9_./%-]+?/)(?=["\'#?])'); links=0
          for f in glob.glob('**/*.html',recursive=True):
              if f.startswith(('_staging/','inventory-review/','node_modules/')): continue
              s=open(f,encoding='utf8').read()
              if 'http-equiv="refresh"' in s: continue
              t=pat.sub(lambda mo: (mo.group(1) or '')+m[mo.group(2)] if mo.group(2) in m else mo.group(0), s)
              if t!=s: open(f,'w',encoding='utf8').write(t); links+=1
          print('baglantisi duzeltilen ek sayfa:',links)
          # 6) koruma kayıtları
          sys.path.insert(0,'scripts'); import seo_engine as se
          d=json.load(open('seo/approved-edits.json')); base=json.load(open('seo/protected-files.json'))['files']
          for name in se.protected(R)['changed']:
              q=R/name; e=d['edits'].setdefault(name,{'baseline_sha256':base[name]})
              e['reviewed_sha256']=se.digest(q)
              e['reason']='2026-11 trafik kurtarma: taşınan adreslerde noindex kaldırıldı ve iç bağlantılar doğrudan yeni adreslere yöneltildi; çalışma zamanı scriptleri ve veri değişmedi.'
              if name.endswith('.html'): e['runtime_sha256']=se.runtime_digest(q.read_text(encoding='utf-8'))
          open('seo/approved-edits.json','w').write(json.dumps(d,ensure_ascii=False,indent=2)+'\n')
          assert se.protected(R)['pass']; print('koruma: OK')
          PYEOF
          python "$RUNNER_TEMP/fix.py"
      - name: Testler
        run: |
          python scripts/test_seo_engine.py
          python scripts/check_seo.py
          python scripts/build_library_catalog.py --check
          python scripts/build_sitemaps.py --check
          python scripts/test_sitemaps.py
          node --test tests/*.mjs
      - name: Dalı gönder ve PR aç
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b seo/trafik-kurtarma
          git add -A -- . ':!drafts'
          git commit -q -m "SEO: taşınan kaynak adreslerinde trafik kaybını durdur" -m "3.940 yönlendirme sayfasından noindex kaldırıldı; iç bağlantılar doğrudan yeni /kutuphane/ adreslerine yöneltildi; üretici ve denetim scriptleri güncellendi."
          git push -f origin seo/trafik-kurtarma
          gh pr create --base main --head seo/trafik-kurtarma --title "SEO: taşınan kaynak adreslerinde trafik kaybını durdur" --body "Eski /kaynak-detay/ ve /kaynak/yeni/ yönlendirme sayfalarından noindex kaldırıldı; 15.000+ iç bağlantı yeni adreslere yöneltildi. Hesaplayıcı, auth ve veri dosyaları değişmedi." || echo "PR otomatik açılamadı: GitHub'da seo/trafik-kurtarma dalı için 'Compare & pull request' butonuna basın."
